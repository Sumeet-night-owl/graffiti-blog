# Checks every pull request into main before it can be merged (and published).
# Require the "Validate blog" check in main's branch protection.
name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate blog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Check post file locations
        run: npm run check:posts

      - name: Check image sizes
        run: npm run check:images

      - name: Type check (npm run check)
        run: npm run check

      - name: Build site (npm run build)
        run: npm run build

      - name: Check links (npm run check:links)
        run: npm run check:links
